<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Life Optimizer</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f1419;
        color: #edeef0;
        font-family: -apple-system, "Inter", sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 8px;
      }
      p {
        color: #8a97a3;
        font-size: 0.85rem;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>
      No connection right now — anything you add will sync automatically once you're back
      online. Cached pages are still available.
    </p>
  </body>
</html>
